name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, publish the Pages artifact, and mint the
# OIDC token deploy-pages exchanges for permission to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are cancelled rather than queued,
# so the newest push wins instead of an older build landing last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: installs exactly what package-lock.json pins and
      # fails if the two have drifted, so a deploy can't silently pick up a
      # different dependency tree than the one tested locally.
      - run: npm ci

      # Type errors and unused-CSS warnings should stop a deploy, not ship.
      - run: npm run check

      - name: Build
        env:
          # This repo is BotNotFound/website, so Pages serves it from
          # https://botnotfound.github.io/website/ and every path needs the
          # /website prefix. Set this to '' if the site ever moves to a custom
          # domain or to a botnotfound.github.io repo, where it is served at the
          # domain root. Nothing else needs changing -- the app reads `base`
          # from $app/paths everywhere.
          BASE_PATH: /website
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
